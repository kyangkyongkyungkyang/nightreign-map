<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나이트레인 시드 파인더</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 전체 화면 맵 -->
  <div id="map"></div>

  <!-- 좌측 상단: 보스 선택 -->
  <div id="boss-panel" class="overlay boss-panel">
    <div class="panel-title">밤의 군주</div>
    <div id="boss-grid" class="boss-grid"></div>
    <div id="boss-info" class="boss-info" style="display:none;"></div>
  </div>

  <!-- 우측 상단: 지형 선택 -->
  <div id="earth-panel" class="overlay earth-panel">
    <div class="panel-title">지형 변동</div>
    <div id="earth-grid" class="earth-grid"></div>
  </div>

  <!-- 하단 중앙: 진행 상태 -->
  <div id="status-bar" class="overlay status-bar" style="display:none;">
    <div id="status-text" class="status-text"></div>
    <div id="identified-chips" class="identified-chips"></div>
    <button id="reset-btn" class="reset-btn">초기화</button>
  </div>

  <!-- 우측 하단: 범례 -->
  <div id="legend" class="overlay legend-panel" style="display:none;">
    <div id="legend-items" class="legend-items"></div>
  </div>

  <!-- 스페셜 이벤트 배너 (상단 중앙) -->
  <div id="special-event" class="overlay special-event" style="display:none;"></div>

  <!-- 모달 -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-bg"></div>
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <div class="modal-head-actions">
          <button id="modal-toggle-under" class="modal-toggle" style="display:none;">지하</button>
          <button id="modal-close" class="modal-close-btn">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="modal-image-wrap" class="modal-image-wrap">
          <img id="modal-image" class="modal-image" alt="" />
        </div>
        <div id="modal-info" class="modal-info"></div>
      </div>
    </div>
  </div>

  <script src="js/seeddata_base.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
